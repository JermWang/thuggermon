<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>THUGGERMON — pocket monster disco</title>
    <meta name="description" content="on foenem, misty trippin." />
    <link rel="icon" type="image/png" sizes="256x256" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />

    <!-- Social share card. og:image must be an ABSOLUTE url — X and most other
         scrapers will not resolve a relative one, and you get a card with no
         image. VITE_SITE_URL is substituted at build time from .env. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="THUGGERMON" />
    <meta property="og:title" content="THUGGERMON" />
    <meta property="og:description" content="on foenem, misty trippin." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="THUGGERMON" />
    <meta name="twitter:description" content="on foenem, misty trippin." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/brand/og.png" />
    <link rel="preload" as="image" href="/brand/logo.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <!-- The gate. Audio needs a gesture anyway, so we may as well make an
         entrance out of it. -->
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-ball" aria-hidden="true"><i></i></div>
        <p class="boot-status">loading the crew…</p>
        <button class="boot-btn" disabled>ENTER THE PARTY</button>
        <p class="boot-note">sound on, obviously</p>
      </div>
    </div>

    <!-- Populated from src/config.js so the copy lives in one place. -->
    <div id="ui"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
